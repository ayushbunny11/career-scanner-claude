name: Slug probe
on:
  workflow_dispatch:
  push:
    paths: [tools/slug-probe.mjs, .github/workflows/slug-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p data && node tools/slug-probe.mjs
      - run: |
          git config user.name "career-scan-bot"
          git config user.email "career-scan-bot@users.noreply.github.com"
          git add data/slug-probe.tsv
          git commit -m "slug probe results" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
