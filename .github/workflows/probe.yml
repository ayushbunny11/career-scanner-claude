name: Probe LinkedIn and Naukri
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [probe/**, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node probe/probe.mjs 2>&1 | tee probe-result.txt
      - name: Save result
        run: |
          mkdir -p data && mv probe-result.txt data/probe-result.txt
          git config user.name "career-scan-bot"
          git config user.email "career-scan-bot@users.noreply.github.com"
          git add data/probe-result.txt
          git commit -m "probe result" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
