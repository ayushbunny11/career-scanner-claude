name: Probe LinkedIn and Naukri
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [probe/**, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node probe/probe.mjs
